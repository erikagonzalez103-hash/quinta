# Tell Erika when someone joins the waitlist.
#
# WHY THIS EXISTS RATHER THAN THE SUPABASE WEBHOOK
# The edge function is fine code that never ran. Robin Frazier signed up twice
# on 19 August — twelve days after it shipped — and no email went out either
# time; the only reason anyone knew was that Robin mentioned it. Whatever was
# missing lived in the Supabase dashboard, where nothing is visible from the
# repo and nothing says a word when it stops working.
#
# This runs from the repo instead. Its history is on the Actions tab, it can be
# run by hand, and when it fails GitHub emails about the failed run — so even a
# broken notifier notifies.
#
# SECRETS NEEDED (Settings → Secrets and variables → Actions → New secret)
#   SUPABASE_SERVICE_ROLE_KEY   Supabase → Settings → API → service_role key.
#                               This one is NOT the publishable key and must
#                               never be committed or pasted into a page.
#   RESEND_API_KEY              the same key the edge function uses.
name: Waitlist alerts

on:
  schedule:
    # Every 15 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # can be several minutes late under load, so treat this as "within the
    # hour", not "on the quarter hour".
    - cron: "*/15 * * * *"
  workflow_dispatch:
    # The "Run workflow" button. Tick dry_run to see what a run WOULD send
    # without sending it — the only safe way to look at a backlog before it
    # goes out to real people. A dry run reads the waitlist and prints every
    # recipient and subject, but sends nothing and stamps nothing, so the
    # rows stay queued for the real run.
    inputs:
      dry_run:
        description: "Preview only: list what would be sent, send nothing, stamp nothing"
        type: boolean
        default: false

# Two runs at once would email twice for the same signup — the second reads
# the row before the first has stamped it.
concurrency:
  group: waitlist-alerts
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check the logic still holds
        run: node tools/waitlist-alerts.test.mjs
      - name: Email about anything new
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # Only ever dry-runs when a human ticked the box on the Run workflow
        # form. The event_name test is belt and braces: a scheduled run that
        # silently dry-ran would send nothing and still go green, which is the
        # one failure this whole workflow exists to prevent, so it is worth
        # making that impossible rather than merely unlikely.
        #
        # inputs.dry_run, NOT github.event.inputs.dry_run — the latter is the
        # STRING "false" when the box is left unticked, and a non-empty string
        # is truthy in a GitHub expression, so it would dry-run every manual
        # run. The script needs the flag and not just DRY_RUN in the env,
        # because its CLI overwrites that variable from argv.
        run: node tools/waitlist-alerts.mjs ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
