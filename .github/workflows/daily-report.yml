# The end-of-day report to erika@quintaand.co.
#
# Answers in one email what otherwise takes four dashboards and a SQL editor:
# who posted today, who signed up, who it's credited to, and whether anything
# on the schedule synced but is NOT actually bookable.
#
# It sends every day, including empty ones. "No signups today" is the sentence
# that tells you the campaign isn't landing; a report that only shows up on
# good days teaches you nothing.
#
# SECRETS (the same two the waitlist alerts use):
#   SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY
name: Daily report

on:
  schedule:
    # Once a day, aimed at about 8pm Dallas. GitHub starts scheduled jobs
    # hours late (in Aug-Oct 2026, between midnight and 8am Dallas), and the
    # old "only send if it is exactly 8pm" check skipped every single run
    # while showing green - the report never once arrived. Now it always
    # sends, and the script reports on yesterday when it runs before noon.
    # Off the hour on purpose: GitHub's top-of-the-hour queue is the slowest.
    - cron: "17 1 * * *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check the logic still holds
        run: node tools/daily-report.test.mjs

      - name: Send it
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node tools/daily-report.mjs
