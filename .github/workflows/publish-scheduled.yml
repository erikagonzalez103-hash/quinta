# Publish scheduled posts and pages.
#
# How to schedule something: build it on a branch named
#   scheduled/YYYY-MM-DD-anything
# and push the branch. Shortly after midnight Dallas time on that date, this
# job merges the branch into main (which publishes it on GitHub Pages) and
# deletes the branch. Several branches can wait at once; each goes out on its
# own date. A branch whose merge conflicts is left alone and the run fails, so
# GitHub emails about it rather than publishing half of it.
#
# First use: the tax-prep blog post, Sunday 15 Nov 2026 at 12:00 a.m. (13 Nov).
#
# Runs at 06:05 UTC = 12:05 a.m. Dallas in winter (1:05 a.m. in summer, when
# Dallas is UTC-5). GitHub's scheduler can start late; "Run workflow" on the
# Actions tab publishes anything due right away.

name: Publish scheduled posts

on:
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

# Shares the class-date jobs' queue so two jobs never push to main at once.
concurrency:
  group: sync-class-dates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge every scheduled branch that is due
        run: |
          git config user.name "Quinta scheduled publish"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(TZ=America/Chicago date +%Y-%m-%d)
          echo "Today in Dallas: $today"
          published=0
          for ref in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/scheduled/'); do
            branch=${ref#origin/}
            due=$(echo "$branch" | sed -n 's#^scheduled/\([0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}\)-.*#\1#p')
            if [ -z "$due" ]; then echo "skip $branch (no date in name)"; continue; fi
            if [[ "$due" > "$today" ]]; then echo "wait $branch (due $due)"; continue; fi
            echo "publish $branch (due $due)"
            if git merge --no-edit -m "Publish scheduled: $branch" "$ref"; then
              published=$((published + 1))
              echo "$branch" >> "$RUNNER_TEMP/done"
            else
              git merge --abort
              echo "::error title=Scheduled publish failed::$branch could not be merged into main (conflict). Nothing from it was published."
              exit 1
            fi
          done
          if [ "$published" -gt 0 ]; then
            git push origin main
            while read -r b; do git push origin --delete "$b"; done < "$RUNNER_TEMP/done"
          else
            echo "Nothing due today."
          fi
