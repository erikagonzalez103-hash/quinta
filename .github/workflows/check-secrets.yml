# What is actually in the secrets? — a read-only check, safe to run any time.
#
# WHY THIS EXISTS
# Waitlist alerts failed 43 times in a row because the key in
# SUPABASE_SERVICE_ROLE_KEY was the wrong KIND of key. There was no way to
# check that without being able to see the secret, and a secret you can see is
# not a secret. So the loop was: change it, run the real job, hope.
#
# This tells you which kind of key is in there — never the key itself — and
# then makes the one read that has been failing.
#
# HOW TO RUN IT
#   GitHub → Actions → "Check secrets" → Run workflow.
#
# HOW TO READ IT
#   GREEN  the waitlist is readable. Run "Waitlist alerts" next and the
#          backlog goes out.
#   RED    it is not. The output says which key is in there and what to
#          replace it with. Nothing was changed either way.
#
# It only ever reads. There is no --apply here and nothing to undo.

name: Check secrets

on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # Including the promise that it never prints a key.
      - name: Check the logic still holds
        run: node tools/check-secrets.test.mjs

      - name: What is in the secrets
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
        run: node tools/check-secrets.mjs
