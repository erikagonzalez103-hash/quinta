# Push the sale prices to Cal.com — from a button, not a terminal.
#
# WHY THIS EXISTS
# The website reads its prices from config.js and classes.js. Cal.com reads its
# own, and Cal.com is the one that takes the money. This is the step that makes
# the two agree. Running it from GitHub means it can be done from a phone,
# between emails, without a laptop or a command line.
#
# HOW TO RUN IT
#   GitHub → Actions → "Sale prices → Cal.com" → Run workflow
#     mode:  sale = put the discounts ON (for the classes listed in config.js)
#            list = take the discounts OFF (every class back to full price)
#     apply: leave UNTICKED first. It prints exactly what it would change and
#            changes nothing. Read that, then run again with it ticked.
#
# BEFORE THE FIRST RUN
# Add the key once: repo Settings → Secrets and variables → Actions →
# New repository secret, named CAL_API_KEY. Get its value from
# Cal.com → Settings → Developer → API keys. Never put it in a file.
#
# TURNING ONE TEACHER ON
#   1. Add her class's slug to SALE.CLASSES in config.js and commit.
#   2. Run this workflow with mode "sale" and apply ticked.
# Both steps are needed: step 1 changes what the website advertises, step 2
# changes what Cal.com charges.

name: Sale prices → Cal.com

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "sale = discounts ON · list = back to full price"
        required: true
        type: choice
        default: sale
        options: [sale, list]
      apply:
        description: "Actually change Cal.com (leave unticked for a dry run)"
        required: false
        type: boolean
        default: false

# Two of these running at once could interleave writes to the same event type.
concurrency:
  group: cal-sale-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      # The money maths and the refusals, checked before anything is written.
      - name: Check the logic still holds
        run: node tools/set-sale-prices.test.mjs

      - name: Set the prices
        env:
          CAL_API_KEY: ${{ secrets.CAL_API_KEY }}
          MODE: ${{ inputs.mode }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [ -z "$CAL_API_KEY" ]; then
            echo "CAL_API_KEY is not set as a repository secret."
            echo "Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

          case "$MODE" in
            sale|list) ;;
            *) echo "Unexpected mode: '$MODE'. Nothing was changed."; exit 1 ;;
          esac

          # ONLY the exact string "true" applies.
          #
          # This was written as ${{ inputs.apply && '--apply' || '' }}, which is
          # wrong in a way that costs money. A GitHub expression treats ANY
          # non-empty string as true — including the string "false" — so on a
          # dispatch path where the input arrives as a string rather than a
          # real boolean, an UNTICKED box would still have applied live price
          # changes. Comparing the string here cannot make that mistake, and
          # anything unexpected falls through to a dry run rather than a write.
          ARGS="--$MODE"
          if [ "$APPLY" = "true" ]; then
            ARGS="$ARGS --apply"
            echo "Applying — this will change what Cal.com charges."
          else
            echo "Dry run: nothing will be written. Tick 'apply' to make it real."
          fi

          node tools/set-sale-prices.mjs $ARGS
