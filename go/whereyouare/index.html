<!-- The Week 2 poll link (printed on every teacher's Story picture as
     quintaand.co/go/whereyouare?ref=tara).
     8 Oct (Erika: fewest taps from post to paying): a teacher's link opens
     the October 21 page with HER class already ticked (?pick=), so it is tap
     the link, Continue to payment, Pay. If her class has no seat that day,
     oct21.html passes her on to the class page (dates in Cal.com) or its
     waitlist. Joshlyn's class has no dates at all, so hers goes straight to
     the waitlist with Investing picked. No ref: the October 21 page.
     Keep ?ref= and the utm tags across the hop - they carry her credit.
     The meta refresh above is only the no-JavaScript fallback. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var ref = (q.get("ref") || "").toLowerCase().replace(/[^a-z0-9-]/g, "");
  var CLASS = { erika: "module-1", tara: "bookkeeping-1", nik: "trademarks",
                stephanie: "brand-101", robin: "landlord", joshlyn: "financial-planning" };
  var WAITLIST = { joshlyn: true };
  var slug = CLASS[ref];
  if (slug && WAITLIST[ref]) {
    q.set("c", slug); q.set("src", "poll");
    location.replace("https://quintaand.co/waitlist.html?" + q.toString());
    return;
  }
  if (slug) q.set("pick", slug);
  var s = q.toString();
  location.replace("https://quintaand.co/oct21.html" + (s ? "?" + s : ""));
})();
</script>
