name = "quinta-schedule-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# Plain settings — safe to read, no secrets here.
#
# WARNING: this file is read ONLY by command-line deploys (`npx wrangler deploy`).
# If the Worker was created by pasting code into the Cloudflare dashboard, NONE
# of these apply and you must add each one by hand under Settings → Variables
# and Secrets. Getting this wrong cost an afternoon: SUPABASE_URL came through
# as undefined and the Worker built the URL "undefined/rest/v1/rpc/...".
[vars]
SUPABASE_URL = "https://pmpaslevwimofohirves.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_t7U8S0paeslz99Y600_ixA_PHauIQcf"
CAL_USERNAME = "quintaandco"
# The schedule shared by every class that has no dates yet. The sync must never
# write dates into this one — all 14 classes would inherit them.
SHARED_EMPTY_SCHEDULE_ID = "2187337"

# Secrets are NOT set here. Set them once, from a terminal:
#   npx wrangler secret put CAL_API_KEY
#   npx wrangler secret put SYNC_TOKEN
#   npx wrangler secret put WEBHOOK_SECRET
# ...or in the Cloudflare dashboard under Settings → Variables and Secrets.
